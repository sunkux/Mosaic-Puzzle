name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
defaults:
  run:
    working-directory: mosaic-apk
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - name: Generate icons
        run: npx capacitor-assets generate --android
      - name: Portrait lock
        run: sed -i 's|<activity|<activity android:screenOrientation="portrait"|' android/app/src/main/AndroidManifest.xml
      - name: Fixed signing key (update-compatible)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - name: Force debug signingConfig to fixed key
        run: |
          cat >> android/app/build.gradle <<'EOF'
 
          android {
              signingConfigs.debug {
                  storeFile file("../../debug.keystore")
                  storePassword "android"
                  keyAlias "androiddebugkey"
                  keyPassword "android"
              }
          }
          EOF
          tail -12 android/app/build.gradle
      - name: Version bump
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Print signing info (diagnostic)
        continue-on-error: true
        run: |
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $AS verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-1" || true
          echo "expected key:"; keytool -list -v -keystore debug.keystore -storepass android | grep SHA1 || true
      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/mosaic_puzzle_1.${{ github.run_number }}.apk"
          ls out
      - uses: actions/upload-artifact@v4
        with:
          name: mosaic-puzzle-apk
          path: mosaic-apk/out/mosaic_puzzle_1.${{ github.run_number }}.apk
