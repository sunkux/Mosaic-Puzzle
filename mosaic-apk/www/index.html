<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e0e12">
<meta name="mobile-web-app-capable" content="yes">
<title>모자이크 퍼즐 데스매치</title>
<style>
  :root{--bg:#0e0e12;--panel:#1a1a22;--tx:#eee;--mut:#9a9aa8;
    --B:#1e88e5;--Y:#f0c850;--R:#e53947;--G:#6aaa64;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg)}
  body{color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;
    touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;position:fixed;inset:0;width:100%}
  #app{--bw:max(300px,min(94vw,520px,calc(100dvh - 450px - env(safe-area-inset-top) - env(safe-area-inset-bottom))));
    height:100%;height:100dvh;overflow-x:hidden;overflow-y:auto;overscroll-behavior:none;
    display:flex;flex-direction:column;align-items:center;
    padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
  input{-webkit-user-select:text;user-select:text}
  .hdr{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 4px}
  .hdr h1{font-size:17px;margin:0;text-align:center;flex:1}
  .hdr button{padding:7px 10px;font-size:13px;min-width:78px}
  .hdr .sp{min-width:78px}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
  #modal.show{display:flex}
  #modal .card{background:var(--panel);border-radius:12px;padding:16px;width:min(92vw,360px);border:1px solid #33333f}
  #modal h2{font-size:16px;margin:0 0 10px}
  #modal .mb{display:flex;gap:8px;justify-content:space-between;margin-top:12px}
  .bar{display:flex;gap:14px;font-size:13px;color:var(--mut);margin-bottom:4px}
  .bar b{color:var(--tx);font-variant-numeric:tabular-nums}
  .bar b.warn{color:#ff6b6b}
  .W{width:var(--bw)}
  #cnt{display:flex;gap:10px;font-size:12px;color:var(--mut);margin-bottom:4px;align-items:center}
  #cnt span{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
  #cnt b{color:var(--tx)}
  .dot{width:10px;height:10px;border-radius:2px;display:inline-block}
  .dot.B{background:var(--B)}.dot.Y{background:var(--Y)}.dot.R{background:var(--R)}.dot.G{background:var(--G)}
  #chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:4px}
  .chip{border-radius:8px;padding:3px 0;text-align:center;font-weight:800;font-size:20px;color:#fff;
    font-variant-numeric:tabular-nums;opacity:.45;transition:opacity .15s,transform .15s;border:2px solid transparent}
  .chip small{display:block;font-size:11px;font-weight:600;opacity:.9}
  .chip.top{opacity:1;border-color:#fff;transform:translateY(-1px)}
  .chip.B{background:var(--B)}.chip.Y{background:var(--Y);color:#222}.chip.R{background:var(--R)}.chip.G{background:var(--G)}
  #sum{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font-size:14px}
  #sum .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
  #sum .v.ok{color:#6fe07a}
  #prog{height:6px;background:#23232d;border-radius:3px;overflow:hidden;margin-bottom:6px}
  #prog div{height:100%;width:0;background:#5b7bd5;transition:width .15s,background .15s}
  #prog div.ok{background:#6fe07a}
  #board{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;aspect-ratio:1;
    background:#000;padding:6px;border-radius:8px;flex:none}
  #board.over{opacity:.5}
  .slot{position:relative;border-radius:4px;background:#12121a}
  .piece{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;
    background:#000;border-radius:4px;overflow:hidden;cursor:pointer;outline:3px solid transparent;outline-offset:-3px}
  .piece i{display:block}
  .piece i.B{background:var(--B)}.piece i.Y{background:var(--Y)}.piece i.R{background:var(--R)}.piece i.G{background:var(--G)}
  .slot.empty{background:#bcd6e6}
  .ctl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px}
  button{background:var(--panel);color:var(--tx);border:1px solid #33333f;border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer}
  button.on{background:#2d3a5a;border-color:#5b7bd5}
  button#bSub{background:#1f6b3a;border-color:#6fe07a;font-weight:700;font-size:16px;padding:8px 22px}
  button#bRand{background:#3a2d5a;border-color:#8b6bd5;font-weight:700}
  button:disabled{opacity:.35;cursor:not-allowed}
  button:active:not(:disabled){transform:scale(.97)}
  .seedrow{display:flex;gap:8px;margin-top:6px;align-items:center}
  .seedrow label{font-size:13px;color:var(--mut)}
  #seedIn{flex:1;min-width:0;background:#12121a;color:var(--tx);border:1px solid #33333f;border-radius:8px;padding:8px;font-size:15px;
    font-family:ui-monospace,Menlo,monospace;letter-spacing:1px;text-transform:uppercase}
  #rec{font-size:14px}
  #rec .row{display:flex;justify-content:space-between;padding:3px 0;font-variant-numeric:tabular-nums}
  #rec .row b{color:#ffd76a}
  #msg{min-height:20px;margin-top:6px;font-size:13px;color:var(--mut);text-align:center}
  #msg.win{color:#6fe07a;font-weight:700}
  #msg.bad{color:#ff6b6b;font-weight:700}
  .note{font-size:12px;color:var(--mut);margin-top:6px;max-width:520px;text-align:center;line-height:1.5}
</style>
</head>
<body>
<div id="app">
<div class="hdr W"><button id="bRec">🏆 기록</button><h1>모자이크 퍼즐 데스매치</h1><span class="sp"></span></div>
<div class="bar"><span>이동 <b id="mv">0</b></span><span id="tlabel">시간</span> <b id="tm">0:00</b><span>제출 <b id="sc">0</b>회</span></div>
<div class="W">
  <div id="cnt"></div>
  <div id="chips"></div>
  <div id="sum"><span>상위 2색 합</span><span class="v" id="sv">0 / 20</span></div>
  <div id="prog"><div id="pb"></div></div>
  <div id="board"></div>
</div>
<div class="ctl W">
  <button id="bSub" disabled>제출</button>
  <button id="bUndo" disabled>되돌리기</button>
</div>
<div class="ctl W">
  <button id="bHl">연결 표시</button>
  <button id="bSnd" class="on">소리 ON</button>
  <button id="bLim">제한시간 10분 OFF</button>
</div>
<div class="seedrow W">
  <label for="seedIn">시드</label>
  <input id="seedIn" maxlength="24" placeholder="시드 입력" autocomplete="off" spellcheck="false">
  <button id="bSeed">시드로 시작</button>
</div>
<div class="ctl W"><button id="bRand">무작위 타일 배치</button></div>
<div id="msg" class="W"></div>
</div>
<div id="modal"><div class="card">
  <h2>🏆 최고 기록</h2>
  <div id="rec">
    <div class="row"><span>20점 달성 최단 이동</span><b id="rMoves">-</b></div>
    <div class="row"><span>20점 달성 최단 시간</span><b id="rTime">-</b></div>
    <div class="row"><span>최고점</span><b id="rScore">-</b></div>
  </div>
  <div class="mb"><button id="bRecReset">초기화</button><button id="bRecClose">닫기</button></div>
</div></div>
<script>
const COLORS='RBGY', TARGET=20, LIMIT=600000;
let board=Array(16).fill(null), started=false, over=false, moves=0, t0=null, timer=null,
    submits=0, hl=false, limitMode=false, sound=true, hist=[], seed='', roundBest=0, resetArm=false;
let rec={moves:null,time:null,score:0};
try{const r=JSON.parse(localStorage.getItem('mosaicRec')||'null'); if(r)rec=Object.assign(rec,r)}catch(e){}
function saveRec(){try{localStorage.setItem('mosaicRec',JSON.stringify(rec))}catch(e){}}
const $=id=>document.getElementById(id);

/* ---------- 시드 RNG ---------- */
function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}
  h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return (h^=h>>>16)>>>0}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function genSeed(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<6;i++)s+=A[Math.floor(Math.random()*A.length)];return s}
function randomBoard(rng){
  const e=Math.floor(rng()*16), C='BYRG';
  board=Array.from({length:16},(_,i)=>{
    if(i===e)return null;
    let s;
    do{ s='';for(let k=0;k<4;k++)s+=C[Math.floor(rng()*4)]; }
    while(new Set(s).size<3); // 4색 전부 다름 또는 쌍 1개만 허용 (3개 이상·쌍 2개 제외)
    return s;
  });
}

let ac=null, clickBuf=null, clickEl=null;
function b64ToBuf(b){const t=atob(b),u=new Uint8Array(t.length);for(let i=0;i<t.length;i++)u[i]=t.charCodeAt(i);return u.buffer}
function audio(){
  if(!ac){
    try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){ac=null}
    if(ac&&!clickBuf){try{const p=ac.decodeAudioData(b64ToBuf(CLICK_B64),b=>{clickBuf=b},()=>{});if(p&&p.catch)p.catch(()=>{})}catch(e){}}
  }
  if(ac&&ac.state==='suspended')ac.resume().catch(()=>{});
  return ac;
}
function click(rate){
  if(!sound)return;
  try{
    const c=audio();
    if(c&&clickBuf){const n=c.createBufferSource();n.buffer=clickBuf;n.playbackRate.value=rate;n.connect(c.destination);n.start();return}
    if(!clickEl)clickEl=new Audio('data:audio/mpeg;base64,'+CLICK_B64);
    const a=clickEl.cloneNode();a.playbackRate=rate;a.play().catch(()=>{});
  }catch(e){}
}
function playMove(){click(1)}
function playUndo(){click(0.85)}

/* ---------- 시간 ---------- */
function elapsed(){return t0===null?0:Date.now()-t0}
function fmtT(ms,dec){
  const t=Math.max(0,ms)/1000, m=Math.floor(t/60), s=t-m*60;
  return dec ? m+':'+(s<10?'0':'')+s.toFixed(1) : m+':'+String(Math.floor(s)).padStart(2,'0');
}
function setTime(ms,warn){ $('tm').textContent=fmtT(ms,false); $('tm').className=warn?'warn':''; }
function tick(){
  if(t0===null||over)return;
  const el=elapsed();
  if(limitMode){
    const rem=LIMIT-el;
    if(rem<=0){endTime();return}
    setTime(Math.ceil(rem/1000)*1000,rem<60000);
  } else setTime(el,false);
}
function startClock(){ clearInterval(timer); t0=Date.now(); timer=setInterval(tick,100); tick(); }
function endTime(){
  over=true; clearInterval(timer); setTime(0,true);
  $('msg').textContent='시간 종료! 이번 판 최고 '+roundBest+'점';$('msg').className='W bad';
  render();
}

/* ---------- 분석 ---------- */
function emptyIdx(){return board.indexOf(null)}
function adj(a,b){return Math.abs((a>>2)-(b>>2))+Math.abs((a&3)-(b&3))===1}
function cellGrid(){
  const g=[];
  for(let r=0;r<8;r++){g.push([]);for(let c=0;c<8;c++){
    const p=board[(r>>1)*4+(c>>1)];
    g[r].push(p?p[(r&1)*2+(c&1)]:null);
  }}
  return g;
}
function analyze(){
  const g=cellGrid(), seen=Array.from({length:8},()=>Array(8).fill(false));
  const res={};for(const c of COLORS)res[c]={size:0,cells:[],total:0};
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const col=g[r][c]; if(!col)continue; res[col].total++;
    if(seen[r][c])continue;
    const q=[[r,c]],comp=[];seen[r][c]=true;
    while(q.length){
      const [y,x]=q.pop();comp.push([y,x]);
      for(const [dy,dx] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const ny=y+dy,nx=x+dx;
        if(ny<0||nx<0||ny>7||nx>7||seen[ny][nx]||g[ny][nx]!==col)continue;
        seen[ny][nx]=true;q.push([ny,nx]);
      }
    }
    if(comp.length>res[col].size){res[col].size=comp.length;res[col].cells=comp}
  }
  return res;
}

/* ---------- 렌더 ---------- */
function renderRec(){
  $('rMoves').textContent=rec.moves===null?'-':rec.moves+'회';
  $('rTime').textContent=rec.time===null?'-':fmtT(rec.time,true);
  $('rScore').textContent=rec.score>0?rec.score+'점':'-';
  $('bRecReset').textContent=resetArm?'한 번 더 누르면 삭제':'초기화';
}
function render(){
  const a=analyze();
  const rank=[...COLORS].sort((x,y)=>a[y].size-a[x].size);
  const top=rank.slice(0,2), sum=a[top[0]].size+a[top[1]].size;
  if(started&&!over){
    if(sum>roundBest)roundBest=sum;
    if(moves>0&&sum>rec.score){rec.score=sum;saveRec();renderRec()}
  }
  $('cnt').innerHTML=COLORS.split('').map(c=>
    `<span><i class="dot ${c}"></i>${c} <b>${started?a[c].total:'-'}</b></span>`).join('');
  $('chips').innerHTML=COLORS.split('').map(c=>
    `<div class="chip ${c}${started&&top.includes(c)?' top':''}"><small>${c}</small>${started?a[c].size:'-'}</div>`).join('');
  const ok=started&&!over&&sum>=TARGET;
  $('sv').textContent=sum+' / '+TARGET;$('sv').className='v'+(ok?' ok':'');
  $('pb').style.width=Math.min(100,sum/TARGET*100)+'%';$('pb').className=ok?'ok':'';
  $('bSub').disabled=!ok;
  $('bUndo').disabled=!started||over||hist.length===0;
  $('mv').textContent=moves;
  const hs=new Map(); // 칸 → 색 (상위 2색의 최대 덩어리)
  if(hl&&started)for(const c of top)for(const [y,x] of a[c].cells)hs.set(y*8+x,c);
  const el=$('board');el.innerHTML='';el.className=over?'over':'';
  const e=emptyIdx();
  board.forEach((p,i)=>{
    const s=document.createElement('div');s.className='slot'+(p||!started?'':' empty');
    if(p){
      const d=document.createElement('div');d.className='piece';
      const sr=(i>>2)*2,sc=(i&3)*2;
      for(let k=0;k<4;k++){
        const q=document.createElement('i');
        q.className=p[k];
        const cy=sr+(k>>1),cx=sc+(k&1),col=hs.get(cy*8+cx);
        if(col){ // 덩어리 바깥쪽 변에만 흰색 2px 윤곽선
          const out=(y,x)=>y<0||y>7||x<0||x>7||hs.get(y*8+x)!==col, sh=[];
          if(out(cy-1,cx))sh.push('inset 0 2px 0 #fff');
          if(out(cy+1,cx))sh.push('inset 0 -2px 0 #fff');
          if(out(cy,cx-1))sh.push('inset 2px 0 0 #fff');
          if(out(cy,cx+1))sh.push('inset -2px 0 0 #fff');
          q.style.boxShadow=sh.join(',');
        }
        d.appendChild(q);
      }
      d.onclick=()=>tap(i);s.appendChild(d);
    }
    el.appendChild(s);
  });
}

/* ---------- 조작 ---------- */
function tap(i){
  if(!started||over)return;
  const e=emptyIdx();
  if(i===e||!board[i])return;
  const sameRow=(i>>2)===(e>>2), sameCol=(i&3)===(e&3);
  if(!sameRow&&!sameCol)return;
  // 같은 행/열이면 빈칸까지 사이의 타일을 전부 한 칸씩 밀기 (1회 이동)
  if(!limitMode&&t0===null)startClock();
  hist.push(board.slice());
  const step=(sameRow?1:4)*(i>e?1:-1);
  for(let k=e;k!==i;k+=step)board[k]=board[k+step];
  board[i]=null;
  moves++;playMove();render();
}
function undo(){
  if(!started||over||!hist.length)return;
  board=hist.pop();moves++;playUndo();render();
}
function newRound(s,msg,cls){
  seed=s;randomBoard(mulberry(hashStr(s)));
  started=true;over=false;hist=[];moves=0;roundBest=0;
  clearInterval(timer);t0=null;
  $('seedIn').value=s;
  if(limitMode){startClock()} else setTime(0,false);
  $('msg').textContent=msg||'';$('msg').className='W'+(cls?' '+cls:'');
  render();
}
$('bRand').onclick=()=>{audio();newRound(genSeed(),'무작위 타일 배치 완료')};
$('bSeed').onclick=()=>{
  audio();
  const s=$('seedIn').value.trim().toUpperCase();
  if(!s){$('msg').textContent='시드를 입력해줘';$('msg').className='W bad';return}
  newRound(s,'시드 '+s+' 시작');
};
$('bUndo').onclick=undo;
$('bHl').onclick=()=>{hl=!hl;$('bHl').classList.toggle('on',hl);render()};
$('bSnd').onclick=()=>{sound=!sound;$('bSnd').classList.toggle('on',sound);$('bSnd').textContent=sound?'소리 ON':'소리 OFF';if(sound)audio()};
$('bLim').onclick=()=>{
  limitMode=!limitMode;
  $('bLim').classList.toggle('on',limitMode);
  $('bLim').textContent='제한시간 10분 '+(limitMode?'ON':'OFF');
  $('tlabel').textContent=limitMode?'남은 시간':'시간';
  if(started)newRound(seed,limitMode?'제한시간 모드 시작 (같은 시드 재시작)':'제한시간 모드 해제 (같은 시드 재시작)');
  else setTime(limitMode?LIMIT:0,false);
};
$('bSub').onclick=()=>{
  if(!started||over)return;
  const a=analyze(),r=[...COLORS].sort((x,y)=>a[y].size-a[x].size),s=a[r[0]].size+a[r[1]].size;
  if(s<TARGET)return;
  const el=elapsed(),notes=[];
  if(moves>0){
    if(rec.moves===null||moves<rec.moves){rec.moves=moves;notes.push('최단 이동 신기록!')}
    if(rec.time===null||el<rec.time){rec.time=el;notes.push('최단 시간 신기록!')}
    saveRec();renderRec();
  }
  submits++;$('sc').textContent=submits;
  newRound(genSeed(),'제출 완료! '+r[0]+' '+a[r[0]].size+' + '+r[1]+' '+a[r[1]].size+' = '+s+
    ' · 이동 '+moves+'회 · '+fmtT(el,true)+(notes.length?' · '+notes.join(' '):'')+' → 다음 배열','win');
};
$('bRec').onclick=()=>{renderRec();$('modal').classList.add('show')};
$('bRecClose').onclick=()=>$('modal').classList.remove('show');
$('modal').onclick=e=>{if(e.target.id==='modal')$('modal').classList.remove('show')};
$('bRecReset').onclick=()=>{
  if(!resetArm){resetArm=true;renderRec();setTimeout(()=>{resetArm=false;renderRec()},3000);return}
  resetArm=false;rec={moves:null,time:null,score:0};saveRec();renderRec();
};
$('msg').textContent='"무작위 타일 배치"를 눌러 시작';
$('seedIn').addEventListener('keydown',e=>{if(e.key==='Enter')$('bSeed').click()});
document.addEventListener('contextmenu',e=>e.preventDefault());
renderRec();render();
</script>
